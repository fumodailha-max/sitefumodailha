<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Tabacaria</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos específicos para o Login centralizado */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            font-family: var(--font-graffiti);
            color: var(--neon-pink);
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
        }

        #btn-login {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-body);
            text-transform: uppercase;
            margin-top: 1rem;
            transition: 0.3s;
        }

        #btn-login:hover {
            box-shadow: 0 0 20px var(--neon-green);
        }

        .error-msg {
            color: #ff4444;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        
        .back-link {
            display: block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
        }
        
        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Área Restrita</h2>
        <form id="login-form">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" required placeholder="admin@tabacaria.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" required placeholder="******">
            </div>
            <button type="submit" id="btn-login">Entrar</button>
            <p id="error-msg" class="error-msg"></p>
        </form>
        <a href="index.html" class="back-link">← Voltar para a Loja</a>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
